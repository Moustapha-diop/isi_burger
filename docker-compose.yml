version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    networks:
      - burger-network

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - burger-network

networks:
  burger-network:
    driver: bridge